<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#e9ddd2" />

    <!-- 커버 글꼴은 여기서 상시 로드하지 않습니다 — 이 청첩장이 실제로 쓰는 것만
         packages/schema 의 ensureFonts() 가 런타임에 붙입니다. 이유는 fonts.ts 주석 참고.
         preconnect 는 그 지연 로드를 빠르게 하려고 남겨둡니다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- <title>·description·og 태그는 여기에 없습니다.

         share 값으로 빌드 시 주입합니다. 문구를 바꾸려면 config를 고치세요.
         (여기에 직접 적으면 카카오 공유 문구와 어긋납니다) -->
  </head>

    <div id="root"></div>
