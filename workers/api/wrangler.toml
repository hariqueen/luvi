name = "luvi-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CDN_BASE = "https://cdn.luv-ai.co.kr"
SITE_ORIGIN = "https://luv-ai.co.kr"
FIREBASE_PROJECT_ID = "wedding-f328e"

# KV — 발행 스냅샷(SNAP:*) · 호스트 매핑(HOST_MAP:*) · 슬러그 매핑(SLUG_MAP:*)
# 생성:  npx wrangler kv namespace create LUVI_KV
# 아래 id 를 발급받은 값으로 채우세요.
[[kv_namespaces]]
binding = "LUVI_KV"
id = "7a0086f850444b0b99ea23e24200c795"

# R2 — 업로드된 이미지·오디오 (egress 무료)
# 생성:  npx wrangler r2 bucket create luvi-assets
# ⚠️ 2026-08-17 로그인-우선 배포를 위해 임시 주석 처리 (R2 계정 미활성).
#    R2 활성화 후 아래 3줄 주석 해제 + `wrangler r2 bucket create luvi-assets` 하고 재배포하면
#    /api/assets/* 업로드가 살아난다.
# [[r2_buckets]]
# binding = "LUVI_ASSETS"
# bucket_name = "luvi-assets"

[observability]
enabled = true

# ─────────────────────────────────────────────────────────────
# Secret — 이 파일에 값을 적지 않는다 (git 에 올라간다).
#
# 필수 (없으면 API 전체가 500):
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL   # 서비스 계정 이메일
#   npx wrangler secret put FIREBASE_PRIVATE_KEY    # 서비스 계정 개인키 (PEM 전체)
#   npx wrangler secret put APP_SECRET              # 업로드 서명·IP 해시용 임의 문자열 32자 이상
#
# 소셜 로그인 (해당 제공자를 쓸 때만):
#   npx wrangler secret put KAKAO_REST_KEY          # ⚠️ 공유용 JavaScript 키와 다른 값
#   npx wrangler secret put KAKAO_CLIENT_SECRET     # 카카오 콘솔에서 "Client Secret 사용" 을 켠 경우만
#   npx wrangler secret put NAVER_CLIENT_ID
#   npx wrangler secret put NAVER_CLIENT_SECRET
#
# FIREBASE_PRIVATE_KEY 는 여러 줄이라 붙여넣기가 까다롭다.
# JSON 키 파일에서 꺼낸 "-----BEGIN PRIVATE KEY-----\n...\n-----END PRIVATE KEY-----\n" 을
# 그대로 넣으면 된다 — Worker 가 literal \n 을 실제 줄바꿈으로 정규화한다.
#
# 등록 확인:  curl https://luvi-api.<계정>.workers.dev/health
# ─────────────────────────────────────────────────────────────

# 🔴 로컬 개발용 인증 우회. `wrangler dev` 에서만 쓰고 운영에는 절대 넣지 않는다.
#    설정하면 `Authorization: Bearer dev` 가 이 uid 로 통과한다 (= 누구나 이 계정으로 로그인).
#    필요할 때만 아래 줄의 주석을 풀고, 끝나면 다시 주석 처리한다.
# [env.dev.vars]
# DEV_FAKE_UID = "dev-uid"
