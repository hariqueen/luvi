name = "luvi-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"

[vars]
CDN_BASE = "https://cdn.luv-ai.co.kr"
SITE_ORIGIN = "https://luv-ai.co.kr"
FIREBASE_PROJECT_ID = "wedding-f328e"

# KV — 발행 스냅샷(SNAP:*) · 호스트 매핑(HOST_MAP:*) · 슬러그 매핑(SLUG_MAP:*)
# 생성:  npx wrangler kv namespace create LUVI_KV
# 아래 id 를 발급받은 값으로 채우세요.
[[kv_namespaces]]
binding = "LUVI_KV"
id = "REPLACE_ME"

# R2 — 업로드된 이미지·오디오 (egress 무료)
# 생성:  npx wrangler r2 bucket create luvi-assets
[[r2_buckets]]
binding = "LUVI_ASSETS"
bucket_name = "luvi-assets"

# Secret 은 이 파일에 적지 않는다. 아래 명령으로 등록:
#   npx wrangler secret put KAKAO_REST_KEY
#   npx wrangler secret put FIREBASE_CLIENT_EMAIL
#   npx wrangler secret put FIREBASE_PRIVATE_KEY

[observability]
enabled = true

# 소셜 로그인 Secret (커스텀 토큰 발급에 필요):
#   npx wrangler secret put KAKAO_REST_KEY
#   npx wrangler secret put KAKAO_CLIENT_SECRET     # 카카오 콘솔에서 켠 경우에만
#   npx wrangler secret put NAVER_CLIENT_ID
#   npx wrangler secret put NAVER_CLIENT_SECRET
